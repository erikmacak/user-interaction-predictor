services:
  db:
    image: postgres:16-alpine
    container_name: uip_postgres
    environment:
      POSTGRES_USER: uip_user
      POSTGRES_PASSWORD: uip_password
      POSTGRES_DB: uip_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uip_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: