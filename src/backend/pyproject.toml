[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor-backend"
version = "0.1.0"
dependencies = [
    "fastapi[standard]>0.127.0",
    "pydantic>2.12.5",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "uvicorn>0.40.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "python-jose[cryptography]>=3.5.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.21",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.9",
    "yt-dlp>=2026.2.21",
    "opencv-python-headless>=4.13.0.92",
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "shazamio>=0.8.1",
    "openai>=2.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[tool.setuptools]
packages = ["api", "core", "domain", "schemas", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"