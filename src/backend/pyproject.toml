[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor-backend"
version = "0.1.0"

dependencies = [
    "fastapi[standard]>0.110",
    "pydantic>2.0",
    "requests>=2.31",
    "uvicorn>0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["api", "core", "domain", "schemas", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]